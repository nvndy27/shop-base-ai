name: shopbase-search
services:
  certificates:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    user: "0"
    volumes:
      - elastic-certificates:/certs
    command:
      - bash
      - -ec
      - |
        if [ ! -f /certs/elasticsearch/elasticsearch.crt ]; then
          /usr/share/elasticsearch/bin/elasticsearch-certutil ca --silent --pem --out /certs/ca.zip
          unzip -o /certs/ca.zip -d /certs
          printf 'instances:\n  - name: elasticsearch\n    dns: [elasticsearch, localhost]\n    ip: [127.0.0.1]\n' > /certs/instances.yml
          /usr/share/elasticsearch/bin/elasticsearch-certutil cert --silent --pem --in /certs/instances.yml --ca-cert /certs/ca/ca.crt --ca-key /certs/ca/ca.key --out /certs/node.zip
          unzip -o /certs/node.zip -d /certs
          chown -R 1000:0 /certs
          find /certs -type d -exec chmod 750 {} \;
          find /certs -type f -exec chmod 640 {} \;
        fi
    restart: "no"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    depends_on:
      certificates:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      cluster.name: shopbase-academic-search
      node.name: elasticsearch
      node.store.allow_mmap: "false"
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca/ca.crt
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    secrets:
      - elastic_password
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - elastic-certificates:/usr/share/elasticsearch/config/certs:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt -u elastic:$$(cat /run/secrets/elastic_password) https://localhost:9200/_cluster/health -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
volumes:
  elastic-data:
  elastic-certificates:
secrets:
  elastic_password:
    file: ./data/amazon-2023/.elasticsearch.password
